<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- 背景透過 (background: transparent) -->
  <defs>
    <!-- アプリの基調となる美しいグリーングラデーション -->
    <linearGradient id="navi-green-large" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />   <!-- 深みのあるエメラルドグリーン -->
      <stop offset="100%" stop-color="#34D399" /> <!-- 明るいミントグリーン -->
    </linearGradient>
    
    <style>
      .navi-shape-large { fill: url(#navi-green-large); }
      .accent-dot-large { fill: #10B981; }
    </style>
  </defs>

  <!-- 全体のサイズを2倍にスケールアップし、中心（200, 200）に綺麗に配置 -->
  <g id="logo-mark-large" transform="translate(200, 200) scale(2) translate(-200, -200)">
    <!-- ターゲットを指し示すナビゲーションシールド -->
    <path d="M 150 250 L 260 140 L 230 280 L 190 240 Z" class="navi-shape-large" />
    <path d="M 260 140 L 130 170 L 150 250 L 190 240 Z" fill="url(#navi-green-large)" opacity="0.8" />
    
    <!-- 目標地点のミニマルドット -->
    <circle cx="285" cy="115" r="10" class="accent-dot-large" />
  </g>
</svg>
